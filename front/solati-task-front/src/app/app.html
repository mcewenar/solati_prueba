
<div class="min-h-screen bg-slate-100 flex items-center justify-center">
  <!-- LOGIN -->
  <div *ngIf="!loggedIn" class="w-full max-w-sm bg-white rounded-2xl shadow-xl p-8">
    <h1 class="text-xl font-bold text-slate-900 mb-6">
      Solati Task – Login
    </h1>

    <form (ngSubmit)="login()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">
          Username
        </label>
        <input
          type="text"
          name="username"
          [(ngModel)]="username"
          class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm
                 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500"
          placeholder="admin"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">
          Password
        </label>
        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm
                 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500"
          placeholder="password"
        />
      </div>

      <div *ngIf="error" class="text-sm text-red-600">
        {{ error }}
      </div>

      <button
        type="submit"
        class="w-full mt-2 inline-flex justify-center items-center
               px-4 py-2 rounded-lg text-sm font-medium text-white
               bg-sky-600 hover:bg-sky-700 focus:outline-none
               focus:ring-2 focus:ring-offset-2 focus:ring-sky-500">
        Login
      </button>
    </form>
  </div>

  <div *ngIf="loggedIn" class="w-full max-w-3xl bg-white rounded-2xl shadow-xl p-8">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-lg font-semibold text-slate-900">
        Welcome, {{ username }} 👋
      </h2>
      <button
        type="button"
        (click)="logout()"
        class="text-xs px-3 py-1 rounded-full border border-slate-300 text-slate-700 hover:bg-slate-50"
      >
        Logout
      </button>
    </div>

    <table class="min-w-full text-sm border border-slate-200 rounded-lg overflow-hidden">
      <thead class="bg-slate-50">
        <tr>
          <th class="px-4 py-2 text-left">ID</th>
          <th class="px-4 py-2 text-left">Title</th>
          <th class="px-4 py-2 text-left">Description</th>
          <th class="px-4 py-2 text-left">Status</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let task of tasks" class="border-t border-slate-200">
          <td class="px-4 py-2">{{ task.id }}</td>
          <td class="px-4 py-2">{{ task.title }}</td>
          <td class="px-4 py-2">{{ task.description }}</td>
          <td class="px-4 py-2">
            <span
              class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium"
              [ngClass]="{
                'bg-emerald-50 text-emerald-700': task.status === 'DONE',
                'bg-amber-50 text-amber-700': task.status !== 'DONE'
              }"
            >
              {{ task.status }}
            </span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
